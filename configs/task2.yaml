# Task 2: paired UI degradation diagnosis (v8 single-call protocol) — sample configuration
# Run from the repository root:
#   python -m tasks.task2.run --config configs/task2.yaml

model: "qwen3-vl-plus"            # model name sent to the API
protocol: "openai"                # openai | anthropic

# Official endpoints, for reference:
#   OpenAI:            https://api.openai.com/v1
#   Anthropic:         https://api.anthropic.com        (protocol: anthropic)
#   DashScope (Qwen):  https://dashscope.aliyuncs.com/compatible-mode/v1
#   Local vLLM:        http://localhost:8000/v1
base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"

# Name of the environment variable holding the API key.
# Default when omitted: OPENAI_API_KEY for protocol=openai,
# ANTHROPIC_API_KEY for protocol=anthropic.
api_key_env: "DASHSCOPE_API_KEY"

input:
  manifest: "data/task2/manifest.jsonl"
  images_root: "data/task2/images"

request:
  temperature: 0.0
  # Frozen request spec: max_tokens is omitted on json_schema calls so a token
  # cutoff cannot truncate the JSON object. protocol=anthropic requires an
  # explicit integer (the runner defaults to 8192 there).
  max_tokens: null
  disable_thinking: true          # send enable_thinking=false where supported (OpenAI-compatible only)
  concurrency: 5
  max_retries: 3                  # only HTTP 408/429/5xx and transport errors retry
  timeout: 600

output:
  predictions: "outputs/task2/predictions/diagnosis_{model}.jsonl"
